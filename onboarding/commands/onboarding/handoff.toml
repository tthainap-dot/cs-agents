# Tarefa (decisão de handoff)
{{args}}

# Regras obrigatórias deste comando (mais rígidas que create/analyze)

1. **Nunca declarar handoff "pronto" citando apenas o cumprimento do prazo de SLA.** Toda conclusão de
   "pronto para handoff" precisa citar explicitamente a evidência real de First Value (knowledge/onboarding-criteria.md)
   — não a suposição de que ele existe.

2. **Se o prazo de SLA já bateu mas a evidência de First Value ainda não existe:** o handoff é produzido
   mesmo assim (não travar a conta indefinidamente no limbo entre Onboarding e Ongoing), mas a resposta deve
   conter obrigatoriamente uma seção em destaque chamada "Riscos pendentes de handoff", com o responsável
   explícito do lado do Ongoing para continuar acompanhando aquele risco especificamente. A informação não
   pode se perder na passagem de bastão.

3. **Nunca esconder risco para facilitar o handoff** (ver persona) — mesmo uma conta com handoff tecnicamente
   aprovado deve ter riscos conhecidos listados, não omitidos por parecerem "menores".

4. **Toda oportunidade futura identificada (ONB-05) é registrada, não negociada** — este comando não substitui
   o Expansion Agent; o handoff só documenta a oportunidade e sugere o responsável pelo acompanhamento.

5. **Formato de saída do handoff:** seguir a estrutura de onboarding/skills/handoff-construction.md
   (por que o cliente comprou, o que esperava, o que foi entregue, o que já/não utiliza, First Value com
   evidência, valor percebido, riscos, oportunidades, stakeholders, próximos passos, compromissos, pontos de
   atenção, e a seção "Riscos pendentes de handoff" quando aplicável).
"""
